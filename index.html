<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1235">
<title>KABOOZE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desk" aria-hidden="true">
  <pre class="hex l" id="hexl"></pre><pre class="hex r" id="hexr"></pre>
  <canvas class="stk bomb" width="16" height="16" style="left:3%;top:12%;--r:-12deg"></canvas>
  <canvas class="stk inv" width="11" height="8" style="right:4%;top:20%;--r:10deg"></canvas>
  <div class="stk tag" style="left:2%;bottom:20%;--r:-6deg">INSERT<br>COIN</div>
  <div class="stk tag fill" style="right:3%;bottom:32%;--r:5deg">PLAYER 1</div>
  <div class="stk tag fill" style="left:5%;top:44%;--r:-4deg">1UP</div>
  <div class="stk cart" style="right:3%;top:48%;--r:8deg"><i>KABOOZE</i></div>
  <canvas class="stk inv" width="11" height="8" style="left:6%;bottom:8%;--r:-9deg"></canvas>
  <div class="stk tag" style="right:5%;bottom:10%;--r:-3deg">HI 099999</div>
</div>
<div id="gb"><div id="gbi">
  <div id="bezel">
    <i id="led"></i><i id="bl1"></i><i id="bl2"></i>
    <div id="screen">
      <div id="top">
        <button class="btn sm" id="back">BACK</button>
        <canvas id="tb" class="bomb" width="16" height="16"></canvas>
        <button class="btn sm" id="menu">MENU</button>
      </div>
      <div id="card"></div>
      <div id="over" hidden></div>
    </div>
  </div>
  <div id="ctl">
    <div id="dpad"><b data-k="up" style="grid-area:1/2"></b><b data-k="left" style="grid-area:2/1"></b><i style="grid-area:2/2"></i><b data-k="right" style="grid-area:2/3"></b><b data-k="down" style="grid-area:3/2"></b></div>
    <div id="ab"><b data-k="b" class="round" style="left:0;top:54px"></b><b data-k="a" class="round" style="left:70px;top:22px"></b><span style="left:14px;top:112px">B</span><span style="left:84px;top:80px">A</span></div>
    <div id="pills"><b data-k="select"></b><b data-k="start"></b><span>SELECT</span><span>START</span></div>
    <div id="spk"><i></i><i></i><i></i><i></i></div>
  </div>
</div></div>
<script src="js/font.js"></script>
<script src="js/audio.js"></script>
<script src="js/avatar.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
